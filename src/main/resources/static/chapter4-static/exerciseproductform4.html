<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品登録フォーム（練習問題用）</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #f7f3ee;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: #5f6f73;
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    section {
      background: #ffffff;
      border: 1px solid #e2d8cc;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(87, 64, 45, 0.08);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .section-title {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
    }

    .count-badge {
      min-width: 72px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #006064;
      background: #d8f3f3;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 42px;
      margin-bottom: 14px;
      padding: 0 12px;
      border: 1px solid #cbbfb4;
      border-radius: 6px;
      font-size: 15px;
      background: #fffdfb;
    }

    input:focus {
      outline: 3px solid rgba(0, 128, 128, 0.18);
      border-color: #008080;
    }

    input[readonly] {
      color: #455a64;
      background: #f1ebe4;
      cursor: default;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #008080;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-line;
    }

    .message.is-success {
      display: block;
      color: #14532d;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .message.is-error {
      display: block;
      color: #7f1d1d;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 6px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee5dd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f1ebe4;
      color: #455a64;
    }

    tbody tr {
      animation: fadeInRow 220ms ease-out;
    }

    tbody tr.is-new {
      background: #fff7c2;
      animation: highlightRow 1500ms ease-out;
    }

    .empty {
      padding: 20px;
      color: #6b7280;
      background: #faf7f3;
      border: 1px dashed #d8cbbf;
      border-radius: 6px;
      text-align: center;
    }

    @keyframes fadeInRow {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes highlightRow {
      0% {
        background: #fff1a8;
      }

      100% {
        background: transparent;
      }
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 960px);
        padding: 24px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>商品登録フォーム（練習問題用）</h1>
    <p>商品名・値段・在庫数を入力して登録ボタンを押すと、POSTリクエストで商品登録APIにデータが送信されます。</p>
  </header>

  <div class="layout">
    <section>
      <h2>商品登録</h2>

      <form id="productForm" novalidate>
        <label for="apiPath">使用するAPI</label>
        <input id="apiPath" type="text" style="color: black;" value="/chapter4-exercise/product" disabled>

        <label for="name">商品名</label>
        <input id="name" name="name" type="text" placeholder="商品名を入力してください" required>

        <label for="price">値段</label>
        <input id="price" name="price" type="number" min="1" placeholder="値段を入力してください" required>

        <label for="stock">在庫数</label>
        <input id="stock" name="stock" type="number" min="0" placeholder="在庫数を入力してください" required>

        <div class="actions">
          <button type="submit">登録する</button>
        </div>
      </form>

      <div id="message" class="message"></div>
    </section>

    <section>
      <div class="section-title">
        <h2>商品一覧</h2>
        <span id="productCount" class="count-badge">0件</span>
      </div>
      <div id="productList" class="empty">まだ商品は登録されていません。</div>
    </section>
  </div>
</main>

<script>
  const apiPath = "/chapter4-exercise/product";
  const form = document.querySelector("#productForm");
  const message = document.querySelector("#message");
  const productList = document.querySelector("#productList");
  const productCount = document.querySelector("#productCount");
  const products = [];

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `message is-${type}`;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  function escapeHtml(value) {
    return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
  }

  function createProductTable(createdProducts) {
    productCount.textContent = `${createdProducts.length}件`;

    if (createdProducts.length === 0) {
      productList.className = "empty";
      productList.textContent = "まだ商品は登録されていません。";
      return;
    }

    productList.className = "";
    productList.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>商品名</th>
              <th>値段</th>
              <th>在庫数</th>
            </tr>
          </thead>
          <tbody>
            ${createdProducts.map((product, index) => `
              <tr class="${index === createdProducts.length - 1 ? "is-new" : ""}">
                <td>${escapeHtml(product.id)}</td>
                <td>${escapeHtml(product.name)}</td>
                <td>${Number(product.price).toLocaleString()}円</td>
                <td>${escapeHtml(product.stock)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const product = {
      name: form.name.value,
      price: form.price.value === "" ? null : Number(form.price.value),
      stock: form.stock.value === "" ? null : Number(form.stock.value)
    };

    try {
      const response = await fetch(apiPath, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
      });

      const responseBody = await response.json();

      if (!response.ok) {
        throw new Error(responseBody.message || "商品登録に失敗しました。");
      }

      products.push(responseBody);
      createProductTable(products);
      showMessage(`「${responseBody.name}」を商品登録しました。`, "success");
      form.name.value = "";
      form.price.value = "";
      form.stock.value = "";
    } catch (error) {
      showMessage(error.message, "error");
    }
  });
</script>
</body>
</html>
