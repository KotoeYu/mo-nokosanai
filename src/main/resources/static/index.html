<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もー残さない！</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #eef7fb;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: #5f6f73;
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    section {
      background: #ffffff;
      border: 1px solid #c9dce8;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(42, 93, 123, 0.09);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .section-title {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
    }

    .count-badge {
      min-width: 72px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #006064;
      background: #d8f3f3;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 42px;
      margin-bottom: 14px;
      padding: 0 12px;
      border: 1px solid #cbbfb4;
      border-radius: 6px;
      font-size: 15px;
      background: #fffdfb;
    }

    input:focus {
      outline: 3px solid rgba(0, 128, 128, 0.18);
      border-color: #008080;
    }

    input[readonly] {
      color: #455a64;
      background: #e5f0f6;
      cursor: default;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #256d85;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-line;
    }

    .message.is-success {
      display: block;
      color: #14532d;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .message.is-error {
      display: block;
      color: #7f1d1d;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 6px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee5dd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f1ebe4;
      color: #455a64;
    }

    tbody tr {
      animation: fadeInRow 220ms ease-out;
    }

    tbody tr.is-new {
      background: #fff7c2;
      animation: highlightRow 1500ms ease-out;
    }

    .empty {
      padding: 20px;
      color: #6b7280;
      background: #f4fbff;
      border: 1px dashed #b8d4e2;
      border-radius: 6px;
      text-align: center;
    }

    @keyframes fadeInRow {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes highlightRow {
      0% {
        background: #d7effc;
      }

      100% {
        background: transparent;
      }
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 960px);
        padding: 24px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>もー残さない！</h1>
      <p>食材と作り置きを管理して、食品ロスを減らそう！</p>
    </header>

    <div class="layout">
      <section>
        <h2>食材・作り置き登録</h2>

        <form id="productForm" novalidate>
          <label for="name">名前（食材・作り置き）</label>
          <input id="name" name="name" type="text" placeholder="例：にんじん、きんぴらごぼう" required>

          <label for="category">種類</label>
          <input id="category" name="category" type="text" placeholder="例：食材、作り置き" required>

          <label for="quantity">数量</label>
          <input id="quantity" name="quantity" type="number" min="1" placeholder="数量を入力してください" required>

          <label for="expiryDate">期限</label>
          <input id="expiryDate" name="expiryDate" type="date">

          <label for="memo">メモ</label>
          <input id="memo" name="memo" type="text" placeholder="保存場所や調理内容など">

          <div class="actions">
            <button type="submit">登録する</button>
          </div>
        </form>

        <div id="message" class="message"></div>
      </section>

      <section>
        <div class="section-title">
          <h2>食材・作り置き一覧</h2>
          <span id="productCount" class="count-badge">0件</span>
        </div>
        <div id="productList" class="empty">まだ商品は登録されていません。</div>
      </section>
    </div>
  </main>

  <script>
    const apiPath = "/chapter5-lecture/product";

    const form = document.getElementById("productForm");
    const productList = document.getElementById("productList");
    const productCount = document.getElementById("productCount");

    async function loadProducts() {
      try {
        const response = await fetch(apiPath);

        if (!response.ok) {
          throw new Error("一覧の取得に失敗しました");
        }

        const products = await response.json();

        productList.innerHTML = "";

        if (products.length === 0) {
          productList.className = "empty";
          productList.textContent = "まだ食材・作り置きは登録されていません。";
          productCount.textContent = "0件";
          return;
        }

        productCount.textContent = products.length + "件";
        productList.className = "";

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        ["名前", "種類", "数量", "期限", "メモ"].forEach(text => {
          const th = document.createElement("th");
          th.textContent = text;
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");


    products.forEach(product => {
        const row = document.createElement("tr");

        [
        product.name,
        product.category,
        product.quantity,
        product.expiryDate || "",
        product.memo || ""
        ].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
        });

        // 編集ボタン
        const editCell = document.createElement("td");
     const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => {
            form.elements["name"].value = product.name;
            form.elements["category"].value = product.category;
            form.elements["quantity"].value = product.quantity;
            form.elements["expiryDate"].value = product.expiryDate || "";
            form.elements["memo"].value = product.memo || "";

            form.dataset.editId = product.id;
            form.querySelector('button[type="submit"]').textContent = "更新";
        });
        editCell.appendChild(editButton);
        row.appendChild(editCell);

      // 削除ボタン
      const deleteCell = document.createElement("td");
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "削除";

      deleteButton.addEventListener("click", async () => {
        if (!confirm("このデータを削除してもいいですか？")) {
          return;
        }

        try {
          const response = await fetch(`${apiPath}/${product.id}`, {
            method: "DELETE"
          });

          if (!response.ok) {
            const errorText = await response.text();
            alert("削除に失敗しました：" + errorText);
            return;
          }

          alert("削除しました！");
          await loadProducts();

        } catch (error) {
          console.error(error);
          alert("削除に失敗しました。");
        }
      });
      
        deleteCell.appendChild(deleteButton);
     row.appendChild(deleteCell);

     tbody.appendChild(row);
    });


          table.appendChild(tbody);
        productList.appendChild(table);

      } catch (error) {
        console.error(error);
        alert("一覧を取得できませんでした");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

const data = {
    name: form.elements["name"].value,
    category: form.elements["category"].value,
    quantity: Number(form.elements["quantity"].value),
    expiryDate: form.elements["expiryDate"].value || null,
    memo: form.elements["memo"].value
};

try {
    const editId = form.dataset.editId;

    const response = await fetch(
        editId ? `${apiPath}/${editId}` : apiPath,
      {
        method: editId ? "PUT" : "POST",
                headers: {
        "Content-Type": "application/json"
      },
        body: JSON.stringify(data)
      }
    );

      if (!response.ok) {
        const errorText = await response.text();
        alert("登録・更新に失敗しました：" + errorText);
        return;
      }

      alert(editId ? "更新しました！" : "登録しました！");

      form.reset();
      delete form.dataset.editId;
      form.querySelector('button[type="submit"]').textContent = "登録";

      await loadProducts();

    } catch (error) {
      console.error(error);
      alert("登録・更新に失敗しました。ブラウザのコンソールを確認してください。");
    }
});

    loadProducts();
  </script>
</body>
</html>
